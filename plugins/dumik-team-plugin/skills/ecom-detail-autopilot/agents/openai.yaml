interface:
  display_name: "详情页批量出图编排器"
  short_description: "完全在 Agent（Codex / Hermes）内自动串跑：pilot 试跑→对话里确认方向→校准回写视觉设定→批量并发抽卡→对话里选片→自检 QA→自动切贴修复→终审交付；三个闸在对话里停等用户，Agent 直接展示图。进度写一份轻量 run-state 到运行记录用于断点续跑，不接前端、不起桥服务"
  default_prompt: "按详情页批量流水线自动串跑：先用一个卖点试跑、在对话里确认方向，沉淀产品级校准回写视觉设定，再批量并发抽卡、选片、修复、终审，三个闸都在对话里停等我。"
